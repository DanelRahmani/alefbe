<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AlefBe · Learn Persian</title>
<meta name="description" content="Learn the Persian (Farsi) alphabet with guided tracing, quizzes, phonics, games and a mini dictionary.">
<meta name="application-name" content="AlefBe">
<link rel="icon" type="image/x-icon" href="data/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="data/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="data/icons/favicon-16.png">
<link rel="apple-touch-icon" href="data/icons/icon-192.png">
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Amiri:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="data/css/styles.css">
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀️ Light</button>

<div class="app">
  <header>
    <div class="logo">الفبا</div>
    <div class="logo-sub">AlefBe · Learn Persian</div>
  </header>

  <nav>
    <a class="active" href="index.html">📚 Learn</a>
    <a href="data/webpages/trace.html">✍️ Trace</a>
    <a href="data/webpages/practice.html">🎯 Practice</a>
    <a href="data/webpages/quiz.html">📝 Quiz</a>
    <a href="data/webpages/phonics.html">🔤 Phonics</a>
    <a href="data/webpages/games.html">🎮 Games</a>
    <a href="data/webpages/dictionary.html">📖 Dict</a>
    <a href="data/webpages/references.html">🔣 Ref</a>
    <a href="data/webpages/grammar.html">📜 Grammar</a>
    <a href="data/webpages/progress.html">📊 Progress</a>
    <a href="data/webpages/stats.html">📈 Stats</a>
  </nav>

  <div class="page-content">
    <div class="filter-bar">
      <button class="fbtn active" onclick="filterL('all',this)">All 32</button>
      <button class="fbtn" onclick="filterL('persian',this)">Persian Only</button>
      <button class="fbtn" onclick="filterL('nc',this)">Non-connecting</button>
      <button class="fbtn" onclick="filterL('new',this)">To Learn</button>
    </div>
    <div class="alpha-grid" id="alpha-grid"></div>
  </div>
</div>

<!-- Letter detail modal -->
<div class="modal-wrap" id="modal-wrap" onclick="if(event.target===this)closeM()">
  <div class="modal">
    <button class="mclose" onclick="closeM()">✕</button>
    <div class="ml" id="ml"></div>
    <div id="mbadge"></div>
    <div class="mt" id="mt"></div>
    <div class="mipa" id="mipa"></div>
    <div class="msec"><h3>Letter Forms</h3><div class="forms-grid" id="mforms"></div></div>
    <div class="msec"><h3>Pronunciation</h3>
      <div class="snd-row"><span>🔊</span><span id="msnd"></span><button class="spk" onclick="speak()">▶ Listen</button></div>
    </div>
    <div class="msec"><h3>Example Word</h3>
      <div class="ex-row">
        <div class="ex-fa" id="mex-fa"></div>
        <div><div class="ex-t" id="mex-t"></div><div class="ex-m" id="mex-m"></div></div>
      </div>
    </div>
    <button class="mlearn" id="mlearnbtn" onclick="togLearned()"></button>
    <button class="mtrace" onclick="traceFromM()">✍️ Trace This Letter</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data/js/shared.js"></script>
<script>
// ── Page init ──
S.filter = S.filter || 'all';
renderAlpha(S.filter);

// Restore active filter button
if (S.filter && S.filter !== 'all') {
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  const map = { persian: 1, nc: 2, new: 3 };
  const idx = map[S.filter];
  if (idx !== undefined) {
    const btns = document.querySelectorAll('.fbtn');
    if (btns[idx]) btns[idx].classList.add('active');
  }
}
</script>
</body>
</html>
